name: Daily Anime

on:
  schedule:
    - cron: '17 0 * * *' # 00:17 UTC — less congested
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: npm ci

      - run: node script.js
        env:
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
