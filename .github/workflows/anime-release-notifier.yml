name: Anime Release Notifier

on:
  workflow_dispatch:
    inputs:
      ignore_cache:
        description: Resend all currently matched released episodes without using or updating the cache
        required: false
        default: false
        type: boolean

concurrency:
  group: todays-anime-release-notifier
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: npm ci

      - uses: actions/cache/restore@v4
        with:
          path: .cache/todays-anime
          key: todays-anime-state-${{ github.run_id }}
          restore-keys: |
            todays-anime-state-

      - run: node script.js
        env:
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          NOTIFICATION_MODE: release
          IGNORE_RELEASE_CACHE: ${{ inputs.ignore_cache }}
          RELEASE_STATE_FILE: .cache/todays-anime/releases.json
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .cache/todays-anime
          key: todays-anime-state-${{ github.run_id }}
